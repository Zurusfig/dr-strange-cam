<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Strange Cam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #landmark-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #debug-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #ff6b1a;
      padding: 12px 16px;
      border: 1px solid #ff6b1a44;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.6;
      min-width: 220px;
      max-width: 300px;
      display: none;
    }
    #debug-panel.visible { display: block; }
    #debug-panel h3 {
      color: #ffb627;
      margin-bottom: 6px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .debug-section { margin-bottom: 8px; }
    .debug-label { color: #ffb62799; font-size: 11px; }
    .debug-value { color: #fff4c2; }
    .debug-combo { color: #ff6b1a; font-weight: bold; }
    #spell-flash {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffb627;
      font-size: 32px;
      font-family: monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 20px #ff6b1a, 0 0 40px #ff6b1a;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff6b1a88;
      font-size: 12px;
      font-family: monospace;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #ff6b1a;
      font-size: 12px;
      font-family: monospace;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="landmark-canvas"></canvas>
    <div id="debug-panel">
      <h3>Dr. Strange Debug</h3>
      <div class="debug-section">
        <div class="debug-label">LEFT HAND</div>
        <div class="debug-value" id="dbg-left-pose">—</div>
      </div>
      <div class="debug-section">
        <div class="debug-label">RIGHT HAND</div>
        <div class="debug-value" id="dbg-right-pose">—</div>
      </div>
      <div class="debug-section">
        <div class="debug-label">COMBO STATE</div>
        <div class="debug-combo" id="dbg-combo">none</div>
      </div>
      <div class="debug-section">
        <div class="debug-label">COMBO HELD (ms)</div>
        <div class="debug-value" id="dbg-combo-held">0</div>
      </div>
      <div class="debug-section">
        <div class="debug-label">PATH SHAPE</div>
        <div class="debug-value" id="dbg-path">none</div>
      </div>
      <div class="debug-section">
        <div class="debug-label">CIRCLE PROGRESS</div>
        <div class="debug-value" id="dbg-circle">0%</div>
      </div>
      <div class="debug-section">
        <div class="debug-label">ACTIVE SPELLS</div>
        <div class="debug-value" id="dbg-spells">—</div>
      </div>
      <div class="debug-section">
        <div class="debug-label">FPS</div>
        <div class="debug-value" id="dbg-fps">0</div>
      </div>
    </div>
    <div id="spell-flash"></div>
    <div id="hint">Press D to toggle debug panel</div>
    <div id="status">Initializing...</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
